<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Recent Orders</title>


  <link rel="stylesheet" href="/css/styles.css">

  <style>
    .site-authbar{
      background:#f7f9ff; border-bottom:1px solid #e5e8ef; color:#2c3e50;
      font:14px/1.2 system-ui,-apple-system,Segoe UI,Roboto,Arial;
    }
    .site-authbar .wrap{
      max-width:800px; margin:0 auto; padding:.5rem 20px;
      display:flex; justify-content:space-between; gap:.75rem; flex-wrap:wrap;
      align-items:center;
    }
    .site-authbar a{ color:#1976D2; text-decoration:none }
    .site-authbar a:hover{ text-decoration:underline }
    .back-home{
      font-weight:700;
      color:#1976D2;
      text-decoration:none;
      white-space:nowrap;
    }

    .orders-container {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }

    .order-card {
      border: 1px solid #dfe3e8;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 20px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    .order-header {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #1a1a1a;
    }

    .order-meta {
      font-size: 14px;
      color: #6b6b6b;
      margin-bottom: 10px;
    }

    .order-items-title {
      font-weight: 600;
      margin-top: 12px;
      margin-bottom: 6px;
      font-size: 15px;
    }

    .order-items {
      margin-left: 16px;
      font-size: 14px;
      line-height: 1.4;
    }

    .order-items li {
      margin-bottom: 4px;
    }

    .order-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:12px;
    }
    .btn{
      border:1px solid #dfe3e8;
      background:#fff;
      padding:8px 12px;
      border-radius:8px;
      cursor:pointer;
      font-weight:600;
    }
    .btn:hover{ background:#f7f9ff }
    .btn-danger{
      border-color:#f1c0c0;
      background:#fff5f5;
      color:#c62828;
    }
    .btn-primary{
      border-color:#bbdefb;
      background:#e3f2fd;
      color:#0d47a1;
    }
    .edit-panel{
      margin-top:12px;
      padding:12px;
      border:1px dashed #dfe3e8;
      border-radius:8px;
      background:#fafbff;
      display:none;
    }
    .edit-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:6px 0;
      border-bottom:1px solid #eef1f4;
    }
    .edit-row:last-child{ border-bottom:none }
    .qty{
      width:80px;
      padding:6px 8px;
      border:1px solid #dfe3e8;
      border-radius:8px;
    }
  </style>
</head>

<body>

  <div class="site-authbar">
    <div class="wrap">
      <a class="back-home" href="/">← Back to Site</a>
      <div id="authbar">Loading…</div>
    </div>
  </div>
  <script src="/js/authbar.js"></script>

  <div class="orders-container">
    <h1>My Orders</h1>
    <div id="my-order-list"></div>
  </div>


  <script src="/js/my-orders.js"></script>

</body>
</html>
