<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Details</title>
  <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
  <input type="checkbox" id="cart-toggle" hidden>

  <header>
    <h1>Shopping Site</h1>
    <nav>
      <ul id="nav-categories"></ul>
    </nav>
    <label for="cart-toggle" class="cart-icon">🛒</label>
  </header>

  <main>
    <section class="product-details" id="product-details">
    </section>

    <!-- 面包屑（Home > Category > Product） -->
    <div class="breadcrumb" id="breadcrumb"></div>
  </main>


  <aside class="shopping-list">
    <h3>Shopping Cart</h3>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-total">
      <span>Total:</span>
      <span class="total-price" id="total-price">HK$0.00</span>
    </div>
    <div class="cart-actions">
      <button class="checkout">Checkout</button>
    </div>
  </aside>

  <footer>
    <p>© 2026 My Shopping Site. All rights reserved.</p>
  </footer>

  <script src="/js/cart.js"></script>

  <script src="/js/product-page.js"></script>

  <div id="toast" class="toast" aria-live="polite"></div>
  
</body>
</html>
